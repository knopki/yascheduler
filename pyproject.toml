[project]
name = "yascheduler"
# version should be changed by automation, not by hand - DON'T TOUCH
version = "1.6.0"
description = """Yet another computing scheduler and cloud orchestration engine"""
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Sergei Korolev", email = "knopki@duck.com" },
  { name = "Andrey Sobolev", email = "as@tilde.pro" },
  { name = "Evgeny Blokhin", email = "eb@tilde.pro" },
  { name = "Anton Domnin", email = "a.v.daomnin@gmail.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: AiiDA",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "aiohttp~=3.8",
  "asyncssh~=2.11",
  "asyncstdlib~=3.10",
  "attrs>=22.2.0",
  "backoff~=2.1.2",
  "pg8000~=1.19",
  "python-daemon~=2.3",
  "typing-extensions >= 4.2.0; python_version < '3.11'",
]

[project.urls]
Changelog = "https://github.com/tilde-lab/yascheduler/blob/master/CHANGELOG.md"
Home = "https://github.com/tilde-lab/yascheduler"
Issues = "https://github.com/tilde-lab/yascheduler/issues"
Source = "https://github.com/tilde-lab/yascheduler"

[project.scripts]
yainit = "yascheduler.utils:init"
yanodes = "yascheduler.utils:show_nodes"
yascheduler = "yascheduler.utils:daemonize"
yasetnode = "yascheduler.utils:manage_node"
yastatus = "yascheduler.utils:check_status"
yasubmit = "yascheduler.utils:submit"

[project.entry-points."aiida.schedulers"]
yascheduler = "yascheduler.aiida_plugin:YaScheduler"

[project.optional-dependencies]
azure = [
  "azure-identity~=1.10.0",
  "azure-mgmt-compute~=27.2.0",
  "azure-mgmt-network~=20.0.0",
]
hetzner = ["hcloud~=2.0"]
upcloud = ["upcloud_api~=2.0"]

[dependency-groups]
dev = [
  "build",
  "commitizen",
  "pytest~=8.0",
  "pytest-asyncio~=0.25",
  "pytest-cov~=6.0",
  "pytest-mock~=3.0",
  "ruff~=0.15.9",
  "sqlfluff>=4.1.0",
  "testcontainers[postgres]~=4.0",
  "twine",
  "zuban",
]

[build-system]
requires = ["cython", "setuptools"]
build-backend = "setuptools.build_meta"

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_files = ["pyproject.toml:^version"]
version_provider = "pep621"
update_changelog_on_bump = true
changelog_incremental = true

[tool.mypy]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = ["-m", "unit"]
testpaths = ["tests/unit", "tests/integration", "tests/e2e"]
markers = [
  "unit: unit tests (no external services)",
  "integration: integration tests (require services like PostgreSQL)",
  "e2e: end-to-end tests (require full environment)",
]

[tool.ruff]
exclude = ["scripts/grace_check.py"]

[tool.ruff.lint]
# Enable specific rules
select = ["ANN", "ASYNC", "E", "F", "I", "N", "UP", "TCH", "W"]
# Disable specific rules
ignore = ["E501"]

[tool.setuptools.package-data]
"yascheduler.adapters.persistence.sql" = ["**/*.sql"]
"yascheduler.data" = [
  "yascheduler.conf",
  "yascheduler.service",
  "yascheduler.sh",
]

[tool.setuptools.packages.find]
include = ["yascheduler*"]

[tool.sqlfluff.core]
templater = "placeholder"

[tool.sqlfluff.templater.placeholder]
param_style = "colon"

[tool.uv]
exclude-newer = "7 days"
